# Hedge Fund desk configuration.
# Everything here is read by code. The AI agents never see or change this file.

[account]
# Paper account used by `meet_the_team` until Robinhood is connected.
paper_equity = 100.0

[strategy]
# "hybrid": bullish -> a call if a liquid, affordable one exists, else fractional shares;
#           bearish -> a put (no put, no trade). One all-in position at a time.
# "options": long calls and long puts only (bullish view -> call, bearish -> put).
# "stock": long stock only.
instrument = "hybrid"

[options]
# How code picks the one contract offered for each candidate.
min_days_to_expiry = 14        # small stocks often list only monthly expiries
max_days_to_expiry = 75
target_delta = 0.55            # near the money: moves with the stock, slower decay
min_delta = 0.35
max_delta = 0.75
max_spread_pct = 0.12          # (ask - bid) / mid
min_open_interest = 100
# Exit plan for every option position (shown with each approved order):
stop_loss_pct = 0.15           # sell if the option loses 15% of what was paid
take_profit_pct = 1.00         # sell if the option doubles
exit_days_before_expiry = 5    # never hold into the last days (fastest decay)

[universe]
# The desk scans the core list below plus (if include_sp500) every S&P 500 stock.
# Only tickers in that universe can ever be analysed or traded.
include_sp500 = true
# Scanning is free (code). Only the best-ranked setups go to the paid analysts.
max_candidates = 8
# Liquidity filter: skip thin or very cheap stocks.
min_price = 10.0
min_dollar_volume = 50_000_000     # 20-day average daily dollar volume
allowlist = [
  # ETFs (10): broad market and sectors
  "SPY", "QQQ", "IWM", "DIA", "XLK", "XLF", "XLE", "XLV", "XLI", "XLY",
  # Large-cap stocks (40), all highly liquid
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "AVGO", "TSLA", "ORCL", "CRM",
  "AMD", "ADBE", "CSCO", "QCOM", "INTC", "IBM", "NFLX", "DIS", "UBER",
  "JPM", "BAC", "GS", "V", "MA",
  "LLY", "UNH", "JNJ", "ABBV", "MRK", "TMO",
  "XOM", "CVX", "CAT",
  "WMT", "COST", "HD", "MCD", "PG", "KO", "PEP",
]
# Options mode only: heavily traded, optionable stocks outside the S&P 500 that are
# cheap enough for a small account's options. Still subject to every filter.
options_extra = [
  "SOFI", "HOOD", "RIVN", "LCID", "NIO", "SNAP", "AAL", "PLUG", "RKLB", "MARA",
  "RIOT", "CLSK", "SOUN", "AFRM", "NU", "GRAB", "LYFT", "PATH", "IONQ", "JOBY",
  "ACHR", "OPEN", "RUN", "BBAI", "PINS", "DKNG",
]
options_min_price = 5.0            # replaces min_price in options mode
options_min_dollar_volume = 20_000_000   # replaces min_dollar_volume in options mode
options_max_checks = 60            # stocks whose option chains are checked per run (~1-2 s each)
# Options mode: also scan cheap, liquid Nasdaq stocks (screened weekly from Nasdaq's
# full symbol list; the stock price band is what a small account's options can afford).
include_nasdaq_cheap = true
nasdaq_min_price = 5.0
nasdaq_max_price = 30.0
nasdaq_min_dollar_volume = 20_000_000
# Used by the Market Regime Analyst only (never traded).
regime_symbols = ["SPY", "QQQ", "IWM", "^VIX", "^TNX", "TLT"]
sector_etfs = ["XLK", "XLF", "XLE", "XLV", "XLI", "XLY", "XLP", "XLU", "XLB", "XLRE", "XLC"]

[risk]
# Enforced by the Gatekeeper (code). Shown to the Portfolio Manager.
# Current style: ONE high-conviction position at a time, sized with all available cash.
# For a diversified style instead: risk_per_trade = 0.01, max_position_pct = 0.15,
# max_open_positions = 6, max_stop_distance_pct = 1.0, min_conviction = 1.
risk_per_trade = 1.0          # 1.0 = size is not limited by risk; the stop cap below limits the loss
max_position_pct = 1.0        # 100% of equity in one position
max_open_positions = 1
max_stop_distance_pct = 0.10  # stop at most 10% below entry: a stop-out loses at most ~10%
min_conviction = 3            # the PM's conviction (1-5) must be at least this to trade
min_reward_risk = 1.5         # (target - entry) / (entry - stop)
daily_halt_pct = -0.03        # no new entries after -3% on the day
weekly_halt_pct = -0.10
max_drawdown_pct = -0.30      # everything stops 30% below the account's peak

[models]
# One model per role. Analysts run on the cheapest model; the PM decides on Opus.
technical_analyst = "claude-haiku-4-5"
catalyst_analyst = "claude-haiku-4-5"
regime_analyst = "claude-haiku-4-5"
portfolio_manager = "claude-opus-5-5"

[effort]
# Only models that support the effort setting use it (not Haiku 4.5).
portfolio_manager = "high"

[prompts]
# Prompt version per role: prompts/<role>/<version>.md
technical_analyst = "v5"   # v5: bullish or bearish direction, for calls and puts
catalyst_analyst = "v1"
regime_analyst = "v1"
portfolio_manager = "v3"   # v3: all-in, conviction 3 acceptable (stock mode)
portfolio_manager_options = "options_v1"   # options mode
portfolio_manager_hybrid = "hybrid_v1"     # hybrid mode
